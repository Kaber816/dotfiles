# vim:ft=kitty

# ---- Font ----
font_family JetBrains Mono Nerd Font
bold_font auto
font_size 17

# ---- Cursor ----
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 5.0
cursor_text_color #121212
cursor #8f9f7b
cursor_trail 0

# ---- Transparency ----
background_opacity 0.75
dynamic_background_opacity yes

# ---- Window ----
window_border_width 1
active_border_color #7E8B6B
inactive_border_color #2A2A2A
window_padding_width 8

# ---- Other ----
enable_audio_bell no

# ---- Base colors ----
foreground #c0c0c0
background #0f0c09

selection_foreground none
selection_background #2a2a2a

# ---- URL / tabs ----
url_color #8F9F7B
active_tab_foreground #D0D0D0
active_tab_background #121212
inactive_tab_foreground #7A7A7A
inactive_tab_background #121212

# ---- ANSI colors ----

# black
color0  #0f0c09
color8  #3a3a3a

# red 
color1  #5c5c5c
color9  #6a6a6a

# green 
color2  #8f9f7b
color10 #7e8b6b

# yellow 
color3  #8a846a
color11 #9a9478

# blue 
color4  #6a6a6a
color12 #7a7a7a

# magenta 
color5  #9a9a9a
color13 #aaaaaa

# cyan 
color6  #7e8e84
color14 #8fa09a

# white / highlight
color7  #b0b0b0
color15 #d0d0d0

# ---- Underlines ----
underline_color #7E8B6B

# BINDS
map alt+j previous_tab
map alt+k next_tab
map alt+shift+j move_tab_backward
map alt+shift+k move_tab_forward
map alt+t new_tab
map alt+c close_tab
map alt+shift+t new_tab_with_cwd
